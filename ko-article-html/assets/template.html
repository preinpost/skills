<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#faf9f5;--fg:#191919;--muted:#5f5d57;--line:#e4e1d8;--card:#f0eee6;--accent:#c96442;--accent-soft:#f6e6dd;--code:#efede5;--fs:18px}
[data-theme=dark]{--bg:#1a1917;--fg:#ecebe6;--muted:#a8a59c;--line:#34322e;--card:#252420;--accent:#e08a68;--accent-soft:#33261f;--code:#2a2925}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1917;--fg:#ecebe6;--muted:#a8a59c;--line:#34322e;--card:#252420;--accent:#e08a68;--accent-soft:#33261f;--code:#2a2925}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;font-size:var(--fs);line-height:1.8;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:30}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:14px}
.brand{font-weight:700}.tag{color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:4px}
.tools button{font:inherit;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
.layout{max-width:1180px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,720px) 260px;gap:60px;justify-content:center}
main{min-width:0}
header.cover{padding:48px 0 24px}
.eyebrow{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.04em}
h1{font-size:2.3em;line-height:1.25;margin:.3em 0 .5em;letter-spacing:-.02em}
.lede{font-size:1.08em;color:var(--fg)}
.byline{color:var(--fg);font-size:15px;font-weight:600;margin:18px 0 0}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:28px 0}
.stat{background:var(--card);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:1.6em;color:var(--accent);line-height:1.2}
.stat>span,.stat small{font-size:13px;color:var(--muted);line-height:1.5;display:block;margin-top:4px}
.notice{border-left:3px solid var(--accent);background:var(--card);padding:12px 16px;font-size:14px;color:var(--muted);border-radius:0 8px 8px 0;margin:20px 0}
details.mtoc{display:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:20px 0;font-size:15px}
details.mtoc summary{cursor:pointer;font-weight:600}
aside.toc{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:14px;padding-top:56px}
.toc-title{font-weight:700;margin-bottom:8px}
.toc ul,.mtoc ul{list-style:none;padding:0;margin:0}
.toc li a,.mtoc li a{display:block;padding:3px 0 3px 10px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line);line-height:1.5}
.toc li.sub a,.mtoc li.sub a{padding-left:22px;font-size:.93em}
.toc li a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
h2{font-size:1.5em;line-height:1.35;margin:2.2em 0 .6em;letter-spacing:-.01em}
h3{font-size:1.18em;margin:1.8em 0 .5em}
p,ul,ol{margin:0 0 1.1em}
li{margin-bottom:.5em}
blockquote{margin:1.4em 0;padding:4px 0 4px 18px;border-left:3px solid var(--line);color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:1.4em 0;font-size:.88em;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card)}
figure{margin:2em 0;width:100%}
figure img,figure video{width:100%;height:auto;display:block;border-radius:8px}
figure img{cursor:zoom-in;background:#fff}
figure video{background:#0d0d0d}
.media{position:relative}
.media.light video{background:#f2efe6}
.pill{position:absolute;top:10px;left:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.pill i{width:6px;height:6px;border-radius:50%;background:#ff6b4a}
figcaption{font-size:.82em;color:var(--muted);margin-top:10px;line-height:1.65}
.fig-label{font-weight:700;color:var(--fg);margin-right:6px}
pre{background:var(--code);border-radius:8px;padding:14px 16px;overflow-x:auto;font-size:.8em;line-height:1.6}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
:not(pre)>code{background:var(--code);border-radius:4px;padding:1px 5px}
.trust ul{list-style:none;padding:0}
.trust li{position:relative;padding-left:26px}
.trust li::before{content:"";position:absolute;left:4px;top:.45em;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.cta{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--card);border-radius:10px;padding:16px 18px;margin:2em 0}
.cta span{display:block;font-size:14px;color:var(--muted)}
.cta .btn{white-space:nowrap;font-weight:600;text-decoration:none}
sup.fn{font-size:.66em;line-height:0;vertical-align:super}
sup.fn a{font-weight:650;padding:0 2px;text-decoration:none}
.fnotes:has(ol:empty){display:none}
.fnotes ol{padding-left:1.4em;font-size:.88em;color:var(--muted)}
.fnotes li{transition:background .3s;border-radius:4px}
.fnotes li.hl{background:var(--accent-soft)}
.fnotes .back{margin-left:.35rem;text-decoration:none}
#fnpop{position:absolute;z-index:40;max-width:min(380px,calc(100vw - 24px));background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);padding:10px 14px;font-size:14px;line-height:1.65;display:none}
#fnpop.on{display:block}
#fnpop .go{display:block;margin-top:6px;font-size:12px}
footer.src{border-top:1px solid var(--line);margin-top:3em;padding:24px 0 60px;font-size:14px;color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
@media (max-width:1040px){.layout{grid-template-columns:minmax(0,720px)}aside.toc{display:none}details.mtoc{display:block}}
@media (max-width:600px){h1{font-size:1.75em}.bar-in{padding:8px 14px}.layout{padding:0 16px}.tag{display:none}.cta{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.bar,#progress,aside.toc,details.mtoc,#lb,#fnpop{display:none!important}body{background:#fff;color:#000}.layout{display:block}figure{break-inside:avoid}article a[href^="http"]::after{content:" (" attr(href) ")";font-size:.8em;color:#555}}
</style>
</head>
<body>
<div id="progress"></div>
<div class="bar"><div class="bar-in"><span class="brand">{{BRAND}}</span><span class="tag">· {{TAG}}</span>
<div class="tools"><button data-fs="-1" title="글자 작게">가-</button><button data-fs="0" title="기본 크기">가</button><button data-fs="1" title="글자 크게">가+</button><button id="theme" title="다크 모드">◐</button><button onclick="print()" title="인쇄">⎙</button></div></div></div>
<div class="layout">
<main>
<header class="cover">
<div class="eyebrow">{{EYEBROW}}</div>
<h1>{{TITLE}}</h1>
<p class="lede">{{LEDE}}</p>
<p class="byline">{{BYLINE}}</p>
<div class="meta">{{DATE}} · 약 {{READ_TIME}}분 · <a href="{{SOURCE_URL}}" target="_blank" rel="noopener">원문 보기 ↗</a></div>
{{STATS}}
<div class="notice">{{NOTICE}}</div>
<noscript><div class="notice">그림 영상은 JavaScript가 켜져 있어야 재생됩니다. 이미지 그림은 그대로 보입니다.</div></noscript>
</header>

<details class="mtoc"><summary>목차</summary><ul>{{TOC}}</ul></details>

<article>
{{BODY}}

<section class="fnotes">
<h2 id="fn">각주</h2>
<ol>{{FOOTNOTES}}</ol>
</section>
</article>

<footer class="src">
<p>원문: <a href="{{SOURCE_URL}}" target="_blank" rel="noopener">{{SOURCE_TITLE}}</a> {{SOURCE_META}}</p>
<p>{{DISCLAIMER}}</p>
<p>단일 HTML 파일 · 모든 이미지와 영상이 내장되어 있어 오프라인에서도 열립니다.</p>
</footer>
</main>
<aside class="toc"><div class="toc-title">목차</div><ul>{{TOC}}</ul></aside>
</div>
<div id="lb"></div>
<div id="fnpop" role="tooltip"></div>
<script id="media-data" type="application/json">{{PAYLOAD}}</script>
<script>
(function(){
var r=document.documentElement,k='ko-art-';
function get(n){try{return localStorage.getItem(k+n)}catch(e){return null}}
function put(n,v){try{localStorage.setItem(k+n,v)}catch(e){}}
// 테마
var t=get('theme');if(t)r.dataset.theme=t;
document.getElementById('theme').onclick=function(){var dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';put('theme',r.dataset.theme)};
// 글자 크기 3단계
var fs=+(get('fs')||0);function sf(){r.style.setProperty('--fs',[16,18,20][fs+1]+'px')}sf();
document.querySelectorAll('[data-fs]').forEach(function(b){b.onclick=function(){var d=+b.dataset.fs;fs=d===0?0:Math.max(-1,Math.min(1,fs+d));put('fs',fs);sf()}});
// 라이트박스 (정지 이미지만)
var lb=document.getElementById('lb'),li=document.createElement('img');lb.appendChild(li);
document.querySelectorAll('main figure img').forEach(function(i){i.onclick=function(){li.src=i.src;li.alt=i.alt;lb.classList.add('on')}});
lb.onclick=function(){lb.classList.remove('on')};
// 모바일 목차: 항목을 누르면 닫기
document.querySelectorAll('.mtoc a').forEach(function(a){a.onclick=function(){a.closest('details').open=false}});
// 진행률 + 현재 섹션 강조
var p=document.getElementById('progress'),hs=[].slice.call(document.querySelectorAll('article h2[id],article h3[id]')),links=document.querySelectorAll('aside.toc a');
function on(){var h=document.documentElement.scrollHeight-innerHeight;p.style.width=(h>0?scrollY/h*100:0)+'%';var cur='';hs.forEach(function(x){if(x.getBoundingClientRect().top<120)cur=x.id});links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+cur)})}
addEventListener('scroll',on,{passive:true});addEventListener('resize',on);on();
// 각주 인라인 팝오버
var pop=document.getElementById('fnpop'),openA=null;
function closePop(){pop.classList.remove('on');openA=null}
document.querySelectorAll('sup.fn a[href^="#fn-"]').forEach(function(a){
  a.addEventListener('click',function(e){
    var id=a.getAttribute('href').slice(1),src=document.getElementById(id);if(!src)return;
    e.preventDefault();
    if(openA===a){closePop();return}
    var c=src.cloneNode(true);c.querySelectorAll('.back').forEach(function(x){x.remove()});
    pop.innerHTML=c.innerHTML;var go=document.createElement('a');go.className='go';go.href='#'+id;go.textContent='각주로 이동 ↓';pop.appendChild(go);
    go.onclick=function(){closePop();src.classList.add('hl');setTimeout(function(){src.classList.remove('hl')},1400)};
    pop.classList.add('on');
    var b=a.getBoundingClientRect(),w=pop.offsetWidth;
    pop.style.left=Math.max(12,Math.min(scrollX+b.left-w/2,scrollX+document.documentElement.clientWidth-w-12))+'px';
    pop.style.top=(scrollY+b.bottom+8)+'px';
    openA=a;
  });
});
document.addEventListener('click',function(e){if(openA&&!pop.contains(e.target)&&e.target!==openA)closePop()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){lb.classList.remove('on');closePop()}});
// 내장 영상을 Blob URL로 재생 (data URI는 시킹이 어긋나는 브라우저가 있다)
var data={};try{data=JSON.parse(document.getElementById('media-data').textContent||'{}')}catch(e){}
function toBlob(b64){var bin=atob(b64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'video/mp4'})}
var vids=[].slice.call(document.querySelectorAll('video[data-key]'));
vids.forEach(function(v){var key=v.getAttribute('data-key');if(data[key]){try{v.src=URL.createObjectURL(toBlob(data[key]))}catch(e){}}});
// 처음 화면에 들어올 때 한 번만 자동 재생, 화면을 벗어나면 멈춤
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){var v=en.target;if(en.isIntersecting){if(!v.dataset.seen){v.dataset.seen='1';var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}}else if(!v.paused)v.pause()})},{threshold:.35});vids.forEach(function(v){io.observe(v)})}
})();
</script>
</body>
</html>
